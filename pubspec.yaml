  intl: ^0.18.1
  video_player: ^2.9.2
  video_player_win: ^3.2.2
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

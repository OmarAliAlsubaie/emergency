<!DOCTYPE html>
<html>
<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>saudi_ready</title>
  <link rel="manifest" href="manifest.json">

  <!-- Web Audio Synthesizer for Emergency Sound Effects & Haptics -->
  <script>
    window.EmergencyAudioSynth = (function() {
      var audioCtx = null;
      function getContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Global User Gesture Unlocker for Chrome / Safari / Edge Autoplay Compliance
      function unlockAudio() {
        try {
          var ctx = getContext();
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
        } catch(e) {}
      }

      if (typeof window !== 'undefined') {
        ['click', 'pointerdown', 'touchstart', 'touchend', 'mousedown', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, unlockAudio, { passive: true });
        });
      }

      return {
        unlockAudio: unlockAudio,
        playSiren: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
            osc.frequency.linearRampToValueAtTime(600, now + 0.8);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.85);
          } catch(e) {}
        },

        playAlarm: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.15, 0.3].forEach(function(delay) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(880, now + delay);
              gain.gain.setValueAtTime(0.2, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.1);
            });
          } catch(e) {}
        },

        playZap: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch(e) {}
        },

        playHeartbeat: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.18].forEach(function(delay, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(i === 0 ? 120 : 90, now + delay);
              gain.gain.setValueAtTime(0.4, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.12);
            });
          } catch(e) {}
        },

        playSuccess: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              gain.gain.setValueAtTime(0.25, now + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.3);
            });
          } catch(e) {}
        },

        playError: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [440, 311.13];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now + i * 0.12);
              gain.gain.setValueAtTime(0.25, now + i * 0.12);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.12);
              osc.stop(now + i * 0.12 + 0.25);
            });
          } catch(e) {}
        },

        playClick: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.04);
          } catch(e) {}
        },

        // =========================================================================
        // COMFORTABLE & SMOOTH AMBIENT SOUNDSCAPES FOR ALL 10 CATEGORIES (60+ SECONDS / INFINITE LOOP)
        // =========================================================================
        stopStationAmbiance: function() {
          if (window._activeStationNodes) {
            window._activeStationNodes.forEach(function(node) {
              try { node.stop(); node.disconnect(); } catch(e){}
            });
          }
          window._activeStationNodes = [];
        },

        _addNode: function(node) {
          if (!window._activeStationNodes) window._activeStationNodes = [];
          window._activeStationNodes.push(node);
        },

        // 1. Fire: Crackling Wood Sparks & Warm Hearth Pop
        playFireStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var stepFreq = (step || 0) * 15;
            
            // Warm flame tone
            var osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180 + stepFreq, now);
            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, now);
            var oscGain = ctx.createGain();
            oscGain.gain.setValueAtTime(0.25, now);
            osc.connect(filter);
            filter.connect(oscGain);
            oscGain.connect(ctx.destination);
            osc.start(now);
            this._addNode(osc);

            // Wood Crackle Impulses
            var bufferSize = ctx.sampleRate * 2;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() < 0.008) ? (Math.random() - 0.5) * 0.9 : 0;
            }
            var crackle = ctx.createBufferSource();
            crackle.buffer = buffer;
            crackle.loop = true;
            var crackleGain = ctx.createGain();
            crackleGain.gain.setValueAtTime(0.40, now);
            crackle.connect(crackleGain);
            crackleGain.connect(ctx.destination);
            crackle.start(now);
            this._addNode(crackle);
          } catch(e) {}
        },

        // 2. Flood: Water Ripples & Liquid Torrent Flow
        playFloodStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var stepFreq = (step || 0) * 20;

            // Dual liquid bubbling FM oscillators
            var carrier = ctx.createOscillator();
            var modulator = ctx.createOscillator();
            var modGain = ctx.createGain();
            var carrierGain = ctx.createGain();

            carrier.type = 'sine';
            carrier.frequency.setValueAtTime(440 + stepFreq, now);
            modulator.type = 'sine';
            modulator.frequency.setValueAtTime(4.5, now); // Rapid 4.5Hz bubbling
            modGain.gain.setValueAtTime(80, now);

            modulator.connect(carrier.frequency);
            carrier.connect(carrierGain);
            carrierGain.gain.setValueAtTime(0.35, now);
            carrierGain.connect(ctx.destination);

            carrier.start(now);
            modulator.start(now);
            this._addNode(carrier);
            this._addNode(modulator);
          } catch(e) {}
        },

        // 3. Electric: Electrical Buzz & Transformer Grid Hum
        playElectricStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var stepFreq = (step || 0) * 10;

            var osc1 = ctx.createOscillator();
            var osc2 = ctx.createOscillator();
            var amOsc = ctx.createOscillator();
            var amGain = ctx.createGain();
            var mainGain = ctx.createGain();

            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(120 + stepFreq, now);
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(240 + stepFreq, now);

            amOsc.type = 'sine';
            amOsc.frequency.setValueAtTime(60, now); // 60Hz grid modulation
            amGain.gain.setValueAtTime(0.4, now);

            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(850, now);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(mainGain);
            mainGain.gain.setValueAtTime(0.35, now);
            mainGain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            amOsc.start(now);
            this._addNode(osc1);
            this._addNode(osc2);
            this._addNode(amOsc);
          } catch(e) {}
        },

        // 4. Heat: Thermal Shimmering Drone (Warm Solfeggio Synth)
        playHeatStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var stepFreq = (step || 0) * 15;

            [300 + stepFreq, 450 + stepFreq].forEach(function(freq) {
              var osc = ctx.createOscillator();
              var lfo = ctx.createOscillator();
              var lfoGain = ctx.createGain();
              var gain = ctx.createGain();

              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);
              lfo.type = 'sine';
              lfo.frequency.setValueAtTime(0.12, now); // Ultra-slow thermal shimmer
              lfoGain.gain.setValueAtTime(12, now);

              lfo.connect(osc.frequency);
              gain.gain.setValueAtTime(0.28, now);
              osc.connect(gain);
              gain.connect(ctx.destination);

              osc.start(now);
              lfo.start(now);
              window.EmergencyAudioSynth._addNode(osc);
              window.EmergencyAudioSynth._addNode(lfo);
            });
          } catch(e) {}
        },

        // 5. Traffic: Car Engine Rumble & Passing Vehicles
        playTrafficStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            // Motor Rumble
            var osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140 + (step || 0) * 10, now);
            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.35, now);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            this._addNode(osc);

            // Periodic Car Doppler Sweep
            var doppler = ctx.createOscillator();
            var dopGain = ctx.createGain();
            doppler.type = 'sine';
            doppler.frequency.setValueAtTime(250, now);
            doppler.frequency.exponentialRampToValueAtTime(120, now + 3.0);
            dopGain.gain.setValueAtTime(0.20, now);
            dopGain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);
            doppler.connect(dopGain);
            dopGain.connect(ctx.destination);
            doppler.start(now);
            this._addNode(doppler);
          } catch(e) {}
        },

        // 6. Cyber: Sci-Fi Computer Chord & Data Bleeps
        playCyberStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var stepOffset = (step || 0) * 2;

            // Futuristic Major Pad
            [261.63, 329.63, 392.00, 523.25].forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq + stepOffset, now);
              gain.gain.setValueAtTime(0.18, now);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              window.EmergencyAudioSynth._addNode(osc);
            });
          } catch(e) {}
        },

        // 7. Desert: Whistling Desert Sandstorm Wind
        playDesertStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            var bufferSize = ctx.sampleRate * 3;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.6;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            // High Q Whistling Filter
            var filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(600 + (step || 0) * 30, now);
            filter.Q.setValueAtTime(4.0, now); // Whistling resonance

            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(0.2, now);
            lfoGain.gain.setValueAtTime(350, now);
            lfo.connect(filter.frequency);
            lfo.start(now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.50, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            this._addNode(noise);
            this._addNode(lfo);
          } catch(e) {}
        },

        // 8. Evacuation: Hallway Pulsing Echo Corridor
        playEvacuationStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var stepFreq = (step || 0) * 15;

            var osc = ctx.createOscillator();
            var lfo = ctx.createOscillator();
            var gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(350 + stepFreq, now);

            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(0.5, now); // Gentle pulse
            var lfoGain = ctx.createGain();
            lfoGain.gain.setValueAtTime(0.12, now);
            lfo.connect(gain.gain);
            lfo.start(now);

            gain.gain.setValueAtTime(0.30, now);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);

            this._addNode(osc);
            this._addNode(lfo);
          } catch(e) {}
        },

        // 9. Home: Soothing 528Hz Pure Acoustic Healing Harmony
        playHomeStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            // Pure 528Hz & 396Hz Solfeggio soothing pair
            [528.00, 396.00].forEach(function(freq) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.20, now);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              window.EmergencyAudioSynth._addNode(osc);
            });
          } catch(e) {}
        },

        // 10. Emergency Kit: Uplifting Celestial Crystal Bell Chimes
        playKitStationSound: function(step) {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            [349.23, 440.00, 523.25, 698.46, 880.00].forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq + (step || 0) * 10, now);
              gain.gain.setValueAtTime(0.16, now);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              window.EmergencyAudioSynth._addNode(osc);
            });
          } catch(e) {}
        }
      };
    })();
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>

  <script src="flutter.js" defer></script>
</head>

  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>

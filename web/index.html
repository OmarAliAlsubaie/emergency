<html>
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>saudi_ready</title>

  <!-- Web Audio Synthesizer for Emergency Sound Effects & Haptics -->
  <script>
    window.EmergencyAudioSynth = (function() {
      var audioCtx = null;
      function getContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      return {
        playSiren: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
            osc.frequency.linearRampToValueAtTime(600, now + 0.8);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.85);
          } catch(e) {}
        },

        playAlarm: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.15, 0.3].forEach(function(delay) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(880, now + delay);
              gain.gain.setValueAtTime(0.2, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.1);
            });
          } catch(e) {}
        },

        playZap: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch(e) {}
        },

        playHeartbeat: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.18].forEach(function(delay, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(i === 0 ? 70 : 55, now + delay);
              gain.gain.setValueAtTime(0.4, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.12);
            });
          } catch(e) {}
        },

        playSuccess: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              gain.gain.setValueAtTime(0.25, now + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.3);
            });
          } catch(e) {}
        },

        playError: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [440, 311.13];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now + i * 0.12);
              gain.gain.setValueAtTime(0.25, now + i * 0.12);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.12);
              osc.stop(now + i * 0.12 + 0.25);
            });
          } catch(e) {}
        },

        playClick: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.04);
          } catch(e) {}
        },

        // Category Station Themed Audio Synthesizers (3-Second Auditory Immersion)
        playFireStationSound: function() {
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(650, now);
            osc.frequency.linearRampToValueAtTime(1300, now + 0.7);
            osc.frequency.linearRampToValueAtTime(650, now + 1.4);
            osc.frequency.linearRampToValueAtTime(1300, now + 2.1);
            osc.frequency.linearRampToValueAtTime(650, now + 2.8);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 3.0);
          } catch(e) {}
        },
        playFloodStationSound: function() {
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            // 1. Water Torrent Roar (Low-pass filtered White Noise)
            var bufferSize = ctx.sampleRate * 3.0;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }

            var noise = ctx.createBufferSource();
            noise.buffer = buffer;

            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(350, now);
            filter.frequency.linearRampToValueAtTime(750, now + 1.5);
            filter.frequency.linearRampToValueAtTime(300, now + 3.0);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);

            // 2. Secondary Water Wave Oscillations
            var osc = ctx.createOscillator();
            var oscGain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.linearRampToValueAtTime(280, now + 1.5);
            osc.frequency.linearRampToValueAtTime(120, now + 3.0);

            oscGain.gain.setValueAtTime(0.35, now);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);

            osc.connect(oscGain);
            oscGain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 3.0);
          } catch(e) {}
        },
        playElectricStationSound: function() {
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1600, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 1.5);
            osc.frequency.setValueAtTime(1400, now + 1.6);
            osc.frequency.exponentialRampToValueAtTime(80, now + 3.0);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 3.0);
          } catch(e) {}
        },
        playHeatStationSound: function() {
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            [0, 0.7, 1.4, 2.1].forEach(function(startT) {
              [0, 0.2].forEach(function(delay, i) {
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(i === 0 ? 80 : 60, now + startT + delay);
                gain.gain.setValueAtTime(0.45, now + startT + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, now + startT + delay + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + startT + delay);
                osc.stop(now + startT + delay + 0.15);
              });
            });
          } catch(e) {}
        },
        playTrafficStationSound: function() {
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.linearRampToValueAtTime(900, now + 1.5);
            osc.frequency.linearRampToValueAtTime(450, now + 3.0);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 3.0);
          } catch(e) {}
        },
        playCyberStationSound: function() {
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var notes = [1200, 1600, 2000, 1400, 1800, 2200, 1000, 1500];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(freq, now + i * 0.15);
              gain.gain.setValueAtTime(0.2, now + i * 0.15);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.15);
              osc.stop(now + i * 0.15 + 0.1);
            });
          } catch(e) {}
        },
        playDesertStationSound: function() {
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var bufferSize = ctx.sampleRate * 3.0;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            var filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(300, now);
            filter.frequency.linearRampToValueAtTime(650, now + 1.5);
            filter.frequency.linearRampToValueAtTime(250, now + 3.0);
            filter.Q.setValueAtTime(3.0, now);
            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
          } catch(e) {}
        },
        playEvacuationStationSound: function() { this.playFireStationSound(); },
        playHomeStationSound: function() { this.playAlarm(); },
        playKitStationSound: function() { this.playSuccess(); }
      };
    })();
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>

</head>

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>

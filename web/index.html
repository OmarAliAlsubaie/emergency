<!DOCTYPE html>
<html>
<head>

    * {
      font-family: 'Tajawal', sans-serif !important;
    }
  </style>

  <!-- Web Audio Synthesizer for Emergency Sound Effects & Haptics -->
  <script>
    window.EmergencyAudioSynth = (function() {
      var audioCtx = null;
      function getContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      return {
        playSiren: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
            osc.frequency.linearRampToValueAtTime(600, now + 0.8);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.85);
          } catch(e) {}
        },

        playAlarm: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.15, 0.3].forEach(function(delay) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(880, now + delay);
              gain.gain.setValueAtTime(0.2, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.1);
            });
          } catch(e) {}
        },

        playZap: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch(e) {}
        },

        playHeartbeat: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.18].forEach(function(delay, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(i === 0 ? 70 : 55, now + delay);
              gain.gain.setValueAtTime(0.4, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.12);
            });
          } catch(e) {}
        },

        playSuccess: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            // Duolingo-like bright major triad / chime: C5 (523Hz), E5 (659Hz), G5 (784Hz), C6 (1046Hz)
            var notes = [
              { freq: 523.25, time: 0.00, duration: 0.18 },
              { freq: 659.25, time: 0.07, duration: 0.18 },
              { freq: 783.99, time: 0.14, duration: 0.22 },
              { freq: 1046.50, time: 0.21, duration: 0.35 }
            ];
            notes.forEach(function(n) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(n.freq, now + n.time);
              gain.gain.setValueAtTime(0, now + n.time);
              gain.gain.linearRampToValueAtTime(0.3, now + n.time + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.duration);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + n.time);
              osc.stop(now + n.time + n.duration);
            });
          } catch(e) {}
        },

        playError: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            // Duolingo-like signature double low thud/buzz ("bum-bum")
            var pulses = [
              { startFreq: 160, endFreq: 100, time: 0.00, duration: 0.12 },
              { startFreq: 130, endFreq: 75,  time: 0.14, duration: 0.16 }
            ];
            pulses.forEach(function(p) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(p.startFreq, now + p.time);
              osc.frequency.exponentialRampToValueAtTime(p.endFreq, now + p.time + p.duration);
              gain.gain.setValueAtTime(0.35, now + p.time);
              gain.gain.exponentialRampToValueAtTime(0.001, now + p.time + p.duration);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + p.time);
              osc.stop(now + p.time + p.duration);
            });
          } catch(e) {}
        },

        playClick: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.04);
          } catch(e) {}
        },

        stopStationAmbiance: function() {},
        playFireStationSound: function() {},
        playFloodStationSound: function() {},
        playElectricStationSound: function() {},
        playHeatStationSound: function() {},
        playTrafficStationSound: function() {},
        playCyberStationSound: function() {},
        playDesertStationSound: function() {},
        playEvacuationStationSound: function() {},
        playHomeStationSound: function() {},
        playKitStationSound: function() {}
      };
    })();
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>

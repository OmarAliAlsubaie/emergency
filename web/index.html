<!DOCTYPE html>
<html>
<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>saudi_ready</title>
  <link rel="manifest" href="manifest.json">

  <!-- Web Audio Synthesizer for Emergency Sound Effects & Haptics -->
  <script>
    window.EmergencyAudioSynth = (function() {
      var audioCtx = null;
      function getContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      return {
        playSiren: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
            osc.frequency.linearRampToValueAtTime(600, now + 0.8);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.85);
          } catch(e) {}
        },

        playAlarm: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.15, 0.3].forEach(function(delay) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(880, now + delay);
              gain.gain.setValueAtTime(0.2, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.1);
            });
          } catch(e) {}
        },

        playZap: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch(e) {}
        },

        playHeartbeat: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.18].forEach(function(delay, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(i === 0 ? 70 : 55, now + delay);
              gain.gain.setValueAtTime(0.4, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.12);
            });
          } catch(e) {}
        },

        playSuccess: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              gain.gain.setValueAtTime(0.25, now + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.3);
            });
          } catch(e) {}
        },

        playError: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [440, 311.13];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now + i * 0.12);
              gain.gain.setValueAtTime(0.25, now + i * 0.12);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.12);
              osc.stop(now + i * 0.12 + 0.25);
            });
          } catch(e) {}
        },

        playClick: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.04);
          } catch(e) {}
        },

        // =========================================================================
        // CONTINUOUS 60+ SECONDS CATEGORY STATION AMBIANCE (INFINITE LOOPING)
        // =========================================================================
        stopStationAmbiance: function() {
          if (window._activeStationNodes) {
            window._activeStationNodes.forEach(function(node) {
              try { node.stop(); node.disconnect(); } catch(e){}
            });
          }
          window._activeStationNodes = [];
        },

        _addNode: function(node) {
          if (!window._activeStationNodes) window._activeStationNodes = [];
          window._activeStationNodes.push(node);
        },

        playFireStationSound: function() {
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            // 60s Siren Sweep Loop
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(650, now);
            gain.gain.setValueAtTime(0.35, now);

            // Oscillate siren pitch back and forth continuously
            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(0.8, now); // 0.8 Hz siren cycle
            lfoGain.gain.setValueAtTime(350, now);
            lfo.connect(osc.frequency);
            lfo.start(now);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);

            this._addNode(osc);
            this._addNode(lfo);
          } catch(e) {}
        },

        playFloodStationSound: function() {
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            // 1. Continuous Roaring Water Noise (60+ Seconds Infinite Loop)
            var bufferSize = ctx.sampleRate * 5.0;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }

            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true; // INFINITE CONTINUOUS LOOP FOR FULL STATION DURATION

            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, now);

            // Modulate filter for realistic water surge
            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(0.3, now);
            lfoGain.gain.setValueAtTime(200, now);
            lfo.connect(filter.frequency);
            lfo.start(now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.40, now); // LOUD AND CLEAR WATER SOUND

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);

            this._addNode(noise);
            this._addNode(lfo);
          } catch(e) { console.error(e); }
        },

        playElectricStationSound: function() {
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now); // 120Hz Mains Electrical Buzz

            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.type = 'square';
            lfo.frequency.setValueAtTime(12, now);
            lfoGain.gain.setValueAtTime(40, now);
            lfo.connect(osc.frequency);
            lfo.start(now);

            gain.gain.setValueAtTime(0.35, now);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);

            this._addNode(osc);
            this._addNode(lfo);
          } catch(e) {}
        },

        playHeatStationSound: function() {
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            // Continuous Heartbeat Pulses Generator
            var self = this;
            var heartbeatInterval = setInterval(function() {
              if (!window._activeStationNodes || window._activeStationNodes.length === 0) {
                clearInterval(heartbeatInterval);
                return;
              }
              try {
                var nowT = ctx.currentTime;
                [0, 0.18].forEach(function(delay, i) {
                  var osc = ctx.createOscillator();
                  var gain = ctx.createGain();
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(i === 0 ? 75 : 55, nowT + delay);
                  gain.gain.setValueAtTime(0.45, nowT + delay);
                  gain.gain.exponentialRampToValueAtTime(0.001, nowT + delay + 0.14);
                  osc.connect(gain);
                  gain.connect(ctx.destination);
                  osc.start(nowT + delay);
                  osc.stop(nowT + delay + 0.14);
                });
              } catch(e){}
            }, 900);

            // Dummy node to keep interval state active
            var dummyOsc = ctx.createOscillator();
            dummyOsc.start(now);
            this._addNode(dummyOsc);
          } catch(e) {}
        },

        playTrafficStationSound: function() {
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);

            var lfo = ctx.createOscillator();
            lfo.frequency.setValueAtTime(2.0, now);
            var lfoGain = ctx.createGain();
            lfoGain.gain.setValueAtTime(250, now);
            lfo.connect(osc.frequency);
            lfo.start(now);

            gain.gain.setValueAtTime(0.35, now);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);

            this._addNode(osc);
            this._addNode(lfo);
          } catch(e) {}
        },

        playCyberStationSound: function() {
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            var bufferSize = ctx.sampleRate * 2;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.2;
            }

            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            var filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1500, now);
            filter.Q.setValueAtTime(5.0, now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.30, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);

            this._addNode(noise);
          } catch(e) {}
        },

        playDesertStationSound: function() {
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;

            var bufferSize = ctx.sampleRate * 4;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }

            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            var filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(350, now);

            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(0.2, now);
            lfoGain.gain.setValueAtTime(250, now);
            lfo.connect(filter.frequency);
            lfo.start(now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.38, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);

            this._addNode(noise);
            this._addNode(lfo);
          } catch(e) {}
        },

        playEvacuationStationSound: function() { this.playFireStationSound(); },
        playHomeStationSound: function() { this.playElectricStationSound(); },
        playKitStationSound: function() { this.playSuccess(); }
      };
    })();
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>

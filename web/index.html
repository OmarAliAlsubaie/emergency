  <!-- Web Audio Synthesizer for Emergency Sound Effects & Haptics -->
  <script>
    window.EmergencyAudioSynth = (function() {
      var audioCtx = null;
      function getContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Global User Gesture Unlocker for Chrome / Safari / Edge Autoplay Compliance
      function unlockAudio() {
        try {
          var ctx = getContext();
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
        } catch(e) {}
      }

      if (typeof window !== 'undefined') {
        ['click', 'pointerdown', 'touchstart', 'touchend', 'mousedown', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, unlockAudio, { passive: true });
        });
      }

      return {
        unlockAudio: unlockAudio,
        playSiren: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
            osc.frequency.linearRampToValueAtTime(600, now + 0.8);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.85);
          } catch(e) {}
        },

        playAlarm: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.15, 0.3].forEach(function(delay) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(880, now + delay);
              gain.gain.setValueAtTime(0.2, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.1);
            });
          } catch(e) {}
        },

        playZap: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch(e) {}
        },

        playHeartbeat: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            [0, 0.18].forEach(function(delay, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(i === 0 ? 120 : 90, now + delay);
              gain.gain.setValueAtTime(0.4, now + delay);
              gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.12);
            });
          } catch(e) {}
        },

        playSuccess: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              gain.gain.setValueAtTime(0.25, now + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.3);
            });
          } catch(e) {}
        },

        playError: function() {
          try {
            var ctx = getContext();
            var now = ctx.currentTime;
            var notes = [440, 311.13];
            notes.forEach(function(freq, i) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now + i * 0.12);
              gain.gain.setValueAtTime(0.25, now + i * 0.12);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.12);
              osc.stop(now + i * 0.12 + 0.25);
            });
          } catch(e) {}
        },

        playClick: function() {
          try {
            var ctx = getContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            var now = ctx.currentTime;
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.04);
          } catch(e) {}
        },

        // =========================================================================
        // COMFORTABLE & SMOOTH AMBIENT SOUNDSCAPES FOR ALL 10 CATEGORIES (60+ SECONDS / INFINITE LOOP)
        // =========================================================================
        stopStationAmbiance: function() {
          if (window._activeStationNodes) {
            window._activeStationNodes.forEach(function(node) {
              try { node.stop(); node.disconnect(); } catch(e){}
            });
          }
          window._activeStationNodes = [];
        },

        _addNode: function(node) {
          if (!window._activeStationNodes) window._activeStationNodes = [];
          window._activeStationNodes.push(node);
        },

        // 1. Fire: Soft Hearth Crackle & Warm Ambiance
        playFireStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var bufferSize = ctx.sampleRate * 4;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.5;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(650, now);
            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.50, now);

            // Add warm hearth harmonic tone
            var osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            var oscGain = ctx.createGain();
            oscGain.gain.setValueAtTime(0.15, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.connect(oscGain);
            oscGain.connect(ctx.destination);

            noise.start(now);
            osc.start(now);
            this._addNode(noise);
            this._addNode(osc);
          } catch(e) {}
        },

        // 2. Flood: Clear Water Stream & Torrent Flow
        playFloodStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var bufferSize = ctx.sampleRate * 5;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.6;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true; // CONTINUOUS LOOP FOR DURATION OF STATION
            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(700, now);
            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(0.3, now);
            lfoGain.gain.setValueAtTime(220, now);
            lfo.connect(filter.frequency);
            lfo.start(now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.55, now); // Clear high audibility on mobile & laptop speakers

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            this._addNode(noise);
            this._addNode(lfo);
          } catch(e) {}
        },

        // 3. Electric: Transformer Hum & Electrical Atmosphere
        playElectricStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            // Uses audible 240Hz + 480Hz dual harmonic for clear laptop/mobile speaker reproduction
            var osc1 = ctx.createOscillator();
            var osc2 = ctx.createOscillator();
            var gain = ctx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(240, now);
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(480, now);

            gain.gain.setValueAtTime(0.35, now);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            this._addNode(osc1);
            this._addNode(osc2);
          } catch(e) {}
        },

        // 4. Heat: Thermal Desert Breeze Swell
        playHeatStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var bufferSize = ctx.sampleRate * 4;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.45;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            var filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(500, now);
            filter.Q.setValueAtTime(1.5, now);

            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(0.2, now);
            lfoGain.gain.setValueAtTime(150, now);
            lfo.connect(filter.frequency);
            lfo.start(now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.48, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            this._addNode(noise);
            this._addNode(lfo);
          } catch(e) {}
        },

        // 5. Traffic: Asphalt & Highway Drift
        playTrafficStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var bufferSize = ctx.sampleRate * 4;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.5;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(550, now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.48, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            this._addNode(noise);
          } catch(e) {}
        },

        // 6. Cyber: Ambient Cyber Synth Pad
        playCyberStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            [261.63, 329.63, 392.00, 523.25].forEach(function(freq) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.20, now);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              window.EmergencyAudioSynth._addNode(osc);
            });
          } catch(e) {}
        },

        // 7. Desert: Desert Sandstorm Wind Swell
        playDesertStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var bufferSize = ctx.sampleRate * 4;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.5;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            var filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(520, now);
            filter.Q.setValueAtTime(1.6, now);

            var lfo = ctx.createOscillator();
            var lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(0.18, now);
            lfoGain.gain.setValueAtTime(200, now);
            lfo.connect(filter.frequency);
            lfo.start(now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.50, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            this._addNode(noise);
            this._addNode(lfo);
          } catch(e) {}
        },

        // 8. Evacuation: Hallway & Atmosphere Ambiance
        playEvacuationStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            [330.00, 440.00].forEach(function(freq) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.22, now);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              window.EmergencyAudioSynth._addNode(osc);
            });
          } catch(e) {}
        },

        // 9. Home: Indoor Warm Airflow
        playHomeStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            var bufferSize = ctx.sampleRate * 3;
            var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() - 0.5) * 0.4;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, now);

            var gain = ctx.createGain();
            gain.gain.setValueAtTime(0.42, now);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            this._addNode(noise);
          } catch(e) {}
        },

        // 10. Emergency Kit: Celestial Chime Pad Ambiance
        playKitStationSound: function() {
          this.unlockAudio();
          this.stopStationAmbiance();
          try {
            var ctx = getContext();
            if (ctx.state === 'suspended') ctx.resume();
            var now = ctx.currentTime;
            [349.23, 440.00, 523.25, 698.46].forEach(function(freq) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.18, now);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              window.EmergencyAudioSynth._addNode(osc);
            });
          } catch(e) {}
        }
      };
    })();
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>

  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
